# FarolLM Small — configuracao para smoke test e debug rapido
# Modelo minusculo para validar pipeline em segundos

model:
  vocab_size: 512
  hidden_size: 64
  intermediate_size: 176
  num_layers: 4
  num_heads: 4
  num_kv_heads: 2
  max_seq_len: 128
  dropout: 0.0
  rope_theta: 10000.0
  rms_norm_eps: 1.0e-5
  tie_word_embeddings: true

training:
  batch_size: 2
  gradient_accumulation_steps: 1
  max_steps: 10
  learning_rate: 1.0e-3
  min_learning_rate: 1.0e-4
  warmup_steps: 2
  weight_decay: 0.1
  grad_clip: 1.0
  dtype: float32
  compile: false

data:
  seq_len: 128

logging:
  log_every_steps: 1
