[project]
name = "farol-lm"
version = "0.1.0"
description = "LLM/SLM multilingual treinada do zero — projeto de pesquisa academica"
authors = [{ name = "Giordano Rec", email = "grec@cin.ufpe.br" }]
license = { text = "MIT" }
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "torch>=2.2",
    "tokenizers>=0.21",
    "sentencepiece>=0.2",
    "transformers>=4.45",
    "datasets>=3.0",
    "litgpt>=0.5",
    "trl>=0.12",
    "peft>=0.13",
    "wandb>=0.19",
    "tensorboard>=2.18",
    "lm-eval>=0.4",
    "numpy>=1.26",
    "safetensors>=0.4",
    "tqdm>=4.66",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.backends._legacy:_Backend"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
